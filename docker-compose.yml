# 部署样例：docker compose up -d
# GH_TOKEN 供 gh CLI 读 open PR（repo:read 权限的 fine-grained token 即可）；
# 缺省时 dashboard 仍可用，open PR 栏报采集错误并沿用上次快照。
services:
  bong-watcher:
    image: ghcr.io/kizunad/bong-watcher:latest
    container_name: bong-watcher
    # tini 做 PID 1：SIGTERM 正常转发给 python，docker stop 秒退不等强杀
    init: true
    ports:
      - "8901:8901"
    environment:
      - GH_TOKEN=${GH_TOKEN}
    volumes:
      - bong-repo:/data
    restart: unless-stopped
    labels:
      # Watchtower 白名单模式（--label-enable）时放行本容器
      - com.centurylinklabs.watchtower.enable=true

  # 已有全局 Watchtower 的环境不需要这个服务（默认不启动）；
  # 没有的话 `docker compose --profile watchtower up -d` 一并拉起。
  watchtower:
    image: containrrr/watchtower
    container_name: bong-watchtower
    profiles: ["watchtower"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable --interval 300 --cleanup
    restart: unless-stopped

volumes:
  bong-repo:
