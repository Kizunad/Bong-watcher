name: Publish image

# push main（含 PR merge）→ 构建镜像推 GHCR :latest + :sha
# 服务器上的 Watchtower 盯 :latest 自动拉取重部署，形成 merge 即上线。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 发布契约：同组串行、排队时 GitHub 只保留最新 pending——连续 push 时
# 中间提交不保证有 sha 镜像，latest 恒指向最新一次完整成功的发布
# （Watchtower 只消费 latest，此语义正是部署所需；如需逐提交镜像另开机制）
concurrency:
  group: publish-image
  # 发布临界区不允许中途取消——防止只推了部分标签的半成品发布
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 单测必须全绿
        run: python3 tests.py

      - name: entrypoint 状态机契约测试（无网络）
        run: sh test_entrypoint.sh

      - name: compose 部署配置校验
        run: |
          GH_TOKEN=dummy docker compose config > /tmp/composed.yml
          grep -q "com.centurylinklabs.watchtower.enable" /tmp/composed.yml
          grep -q "ghcr.io/kizunad/bong-watcher:latest" /tmp/composed.yml
          grep -q "bong-repo" /tmp/composed.yml
          grep -q "init: true" /tmp/composed.yml
          GH_TOKEN=dummy docker compose --profile watchtower config | grep -q "containrrr/watchtower"
          echo "compose 配置校验 OK"

      - name: 构建镜像（先不推）
        run: docker build -t bong-watcher:ci .

      - name: 容器冒烟 ① 正常路径（无 GH_TOKEN 降级契约）
        run: |
          docker run -d --rm --init --name smoke -p 8901:8901 bong-watcher:ci
          for i in $(seq 1 60); do
            sleep 10
            body=$(curl -sf http://localhost:8901/api/state.json || true)
            err=$(printf '%s' "$body" | python3 -c "import json,sys; print(json.load(sys.stdin).get('error'))" 2>/dev/null || echo pending)
            [ "$err" = "None" ] && break
          done
          test "$err" = "None" || { echo "首轮采集未成功: $err"; docker logs smoke; exit 1; }
          printf '%s' "$body" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['module_count']>0, '模块索引为空'; assert d['open_prs_error'], '无 GH_TOKEN 却没有字段级降级错误'; assert d['error'] is None, '整轮不应因缺 token 报错'; print('无 token 降级契约 OK:', d['module_count'], '模块')"
          curl -sf -o /dev/null http://localhost:8901/module-map/
          docker stop smoke

      - name: 容器冒烟 ② 克隆失败仍存活契约
        run: |
          docker run -d --rm --init --name smoke2 -p 8902:8901 \
            -e BONG_REPO_URL=https://invalid.invalid/nope.git \
            -e CLONE_TIMEOUT=5 -e CLONE_RETRY_DELAYS="1 1 1" bong-watcher:ci
          # 克隆在后台跑，HTTP 必须 30s 内可达——锁"clone 不阻塞服务"契约
          for i in $(seq 1 10); do
            sleep 3
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8902/api/state.json || true)
            [ "$code" = "200" ] && break
          done
          test "$code" = "200" || { echo "克隆未完成时 HTTP 未在 30s 内可达"; docker logs smoke2; exit 1; }
          # 等后台克隆流程明确终败（短超时+短重试，约 20s 内），再验终败后的存活
          for i in $(seq 1 12); do
            sleep 5
            docker logs smoke2 2>&1 | grep -q "克隆最终失败" && break
          done
          docker logs smoke2 2>&1 | grep -q "克隆最终失败" || { echo "未观察到克隆终败日志"; docker logs smoke2; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8902/api/state.json)
          test "$code" = "200" || { echo "克隆终败后 HTTP 未存活"; docker logs smoke2; exit 1; }
          curl -s http://localhost:8902/api/state.json | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['error'], '仓库缺失应报采集错误'; print('克隆终败后存活契约 OK')"
          docker stop smoke2

      - name: 容器冒烟 ③ 克隆进行中 stop 秒退契约
        run: |
          # 长重试间隔让 clone worker 确定处于运行态（重试 sleep 中）
          docker run -d --rm --init --name smoke3 -p 8903:8901 \
            -e BONG_REPO_URL=https://invalid.invalid/nope.git \
            -e CLONE_TIMEOUT=5 -e CLONE_RETRY_DELAYS="600 600" bong-watcher:ci
          sleep 12   # 首次 clone 已失败、worker 进入 600s 重试 sleep（仍在运行）
          docker logs smoke3 2>&1 | grep -q "后重试" || { echo "clone worker 未进入重试运行态"; docker logs smoke3; exit 1; }
          t0=$(date +%s)
          docker stop smoke3
          dt=$(( $(date +%s) - t0 ))
          test "$dt" -le 5 || { echo "克隆进行中 docker stop 用了 ${dt}s（supervisor 未转发/回收）"; exit 1; }
          echo "克隆进行中 stop 秒退契约 OK (${dt}s)"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 冒烟全绿后推送（sha 先行确认，latest 最后提升）
        run: |
          # 顺序契约：不可变 sha 标签推送成功后才提升 latest——
          # 失败/中断的发布绝不更新 Watchtower 订阅的标签
          docker tag bong-watcher:ci ghcr.io/kizunad/bong-watcher:${{ github.sha }}
          docker push ghcr.io/kizunad/bong-watcher:${{ github.sha }}
          docker tag bong-watcher:ci ghcr.io/kizunad/bong-watcher:latest
          docker push ghcr.io/kizunad/bong-watcher:latest
